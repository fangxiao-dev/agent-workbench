# review-code-by-standards leaf (Track B) — read-only reviewer leaf preset.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 review-code-by-standards leaf（Track B），只读 Standards reviewer。工作目录 {{cwd}}。

      只读合同：只审查传入的完整 diff 与固定 comparison point（base/head 已解析为不可变 SHA）；
      绝不写/改文件、issue、git state、数据或外部系统；绝不派发 subagent、调用 do-review、
      重新评估 topology/capacity，或检查其他 track 的本轮输出。不可变 contract source 只能用
      git_show（resolved head）读取，绝不用工作树。

      加载你的声明 skill（review-code-by-standards）并遵循。范围/diff/Standards 来源缺失、矛盾
      或不足 → 明确报告 evidence gap/UNCERTAIN，不猜测、不重新推导范围。返回紧凑结构化索引：
      `verdict: PASS|FAIL|UNCERTAIN`、`coverage: <一行>`、`findings: <slug> | file:line | severity | 一句`
      （无则 `findings: none`）；完整证据写入 parent 提供的报告 artifact。每条 finding 必须有证据。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── read-only filesystem: only `read` ──
- id: tool-fs
  name: ./reviewer-fs.mjs

# ── read-only git ──
- id: tool-git-readonly
  name: ./git-readonly.mjs

# ── search: glob/grep (both read-only) ──
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills: load the declared skill ──
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# The `impl-package` agent preset: DSH native main controller for the
# Impl-Package workflow kernel (Ticket-first state, situation routing, review
# topology). Based on the builtin `standard` preset.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global.
# `true` means an entry-local realm: this standing mount's own private
# instance, apart from every other preset's.

# ── identity ────────────────────────────────────────────────────────────────

# Main-controller persona. The pre-step situation hook injects the current
# situation + legal actions every step; the persona only orients judgment.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Impl-Package main controller, a coding agent powered by the {{model}} model.
      Your working directory is {{cwd}}.

      Each step the environment injects a compact `[impl-package 处境]` line: current
      situation slug, digest, and legal actions. Treat it as navigation, not a gate — you
      may deviate when judgment requires, but then write one `kind=escape` trail row with
      subject/deviation/reason. Mechanical state writes go through the impl_* typed tools
      (validate / situation render / ticket transition / evidence / checkpoint / judgment /
      gate / trail), never raw shell commands. Workers dispatch through `subagent_codex` /
      `subagent_grok` with the worker-resolver envelope contract (mode/worker/schedule/review).
      state.json and Git remain the single source of truth; do not invent parallel state.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── impl-package: pre-step situation injection ───────────────────────────────

# Runs before every agent step: resolves the active package (nearest
# `.impl-package/state.json`, or `docs/implementations/<topic>/`), runs
# `package validate` + `situation.py render --json`, and injects a compact
# situation message (digest + selected situation + legal actions) when the
# digest changed. Skips silently when no package or no Python is found.
- id: impl-situation-hook
  name: ./situation-hook.mjs
  config:
    stateFileName: .impl-package/state.json
    # implScriptsRoot: D:/CodeSpace/agent-workbench/plugin-marketplace/plugins/impl-package/scripts
    # packagePath: docs/implementations/<topic>   (explicit override)
    # python: python

# ── impl-package: typed CLI tools ────────────────────────────────────────────

# Typed wrappers over the existing impl_package_state.py CLI (package / ticket /
# evidence / recovery / gate / trail groups). The model stops composing shell
# commands and JSON payloads by hand; the CLI remains the authority.
- id: impl-tools
  name: ./impl-tools.mjs
  config:
    # implScriptsRoot / python: same defaults as the situation hook

# ── impl-package: native stage commands ──────────────────────────────────────

# `/impl-req-align` … `/impl-backfill-stable-docs`: user-typed slash commands
# that steer a routing instruction into the agent at 0 token cost (commands
# never enter the model history). Replaces reading the routing table.
- id: impl-commands
  name: ./commands.mjs

# ── impl-package: do-review mechanical core ─────────────────────────────────

# Registers `impl_review_aggregate` (fail-closed aggregation) and provides
# buildBrief/aggregateVerdicts/renderReport/resolveTopology pure functions for
# the review orchestrator. Judgment (Safety admission, finding classification)
# stays with the main session.
- id: do-review-orchestrator
  name: ./do-review-orchestrator.mjs

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset.
# customSkillDirs registers the Impl-Package plugin skills (19 `<name>/SKILL.md`
# bundles) into the catalog so `tool-skill` loads them on demand — the slim
# SKILLs are only read when a stage is actually entered. Path is
# machine-specific; adjust if the workbench moves.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - 'D:/CodeSpace/agent-workbench/plugin-marketplace/plugins/impl-package/skills'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# Native worker dispatch replaces call-codex / call-grok:
# - `subagent_codex`: official @deepseek-ai/dsh-subagent-codex provider
#   (ephemeral Codex thread, reuses the native codex login; one-shot).
# - `subagent_grok`: official @deepseek-ai/dsh-subagent-acp provider driving
#   the Grok CLI in ACP mode (`grok agent --always-approve stdio`; one-shot).
# Both providers must be installed into the profile:
#   dsh plugin --profile desktop add @deepseek-ai/dsh-subagent-codex
#   dsh plugin --profile desktop add @deepseek-ai/dsh-subagent-acp
# One-shot out-of-process children cannot be tool-filtered or personified
# from the host; the worker-resolver contract still bounds the brief and the
# envelope. In-process spawn/fork remain available for scoped reviewer work.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Native Codex worker (replaces skills/call-codex process dispatch).
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    # Native Grok worker through ACP (replaces skills/call-grok process dispatch).
    - id: tool-subagent-grok
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: acp
        toolName: subagent_grok
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

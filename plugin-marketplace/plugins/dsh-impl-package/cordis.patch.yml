# dsh-impl-package bundle patch: inserts the host plugin row and the Codex
# subagent provider row into the profile roster. Applied as a profile bundle
# layer (the `dsh.bundle.patch` manifest field). The node half
# (`lib/index.mjs`) runs in the host process and syncs the bundled agent
# presets into ~/.dsh/.agent-presets on startup.
#
# Subagent provider (host-plane singleton, mounted once per profile):
# - `subagent-codex`: official @deepseek-ai/dsh-subagent-codex provider.
#   One-shot ephemeral Codex thread; reuses the native codex login
#   (CODEX_HOME). `permissionMode: never` keeps the thread unattended.
# The npm package must be installed into the profile (it is a profile
# dependency); loading the row starts no process until a bound tool calls
# it. The `impl-package` agent preset enables the matching `subagent_codex`
# tool row (it auto-registers on `subagent/provider-added`).
- insert:
    - id: dsh-impl-package
      name: 'dsh-impl-package'

    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex
        permissionMode: never

model = "gpt-6-luna"
model_reasoning_effort = "max"
model_context_window = 512000
model_auto_compact_token_limit = 435200
service_tier = "fast"
developer_instructions = '''
Read and follow the complete monitor contract in `~/.codex/agents/grok-monitor/agent.md` before taking action.
This profile observes caller-supplied Grok PIDs/result paths and lightweight read-only Git summaries for the
supplied worktree, branch/ref, and baseline. Report meaningful running diff progress and each terminal target
immediately, then continue monitoring the rest.
'''

[features]
fast_mode = true

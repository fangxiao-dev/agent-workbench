<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Codex 进度台</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Codex 进度台首页">
          <span class="brand-mark">C</span>
          <span><strong>Codex</strong><small>实时进度台</small></span>
        </a>

        <div class="task-controls">
          <label for="task-select">当前任务</label>
          <select id="task-select" aria-label="切换 Codex 任务"></select>
          <label class="package-label" for="package-select">实施包</label>
          <select id="package-select" aria-label="选择关联实施包"></select>
        </div>

        <div class="connection" id="connection" role="status" aria-live="polite">
          <span class="connection-dot"></span>
          <span id="connection-label">正在连接</span>
        </div>
      </header>

      <section class="overview-strip" aria-labelledby="task-title">
        <div class="overview-title">
          <p class="eyebrow">当前全局判断</p>
          <h1 id="task-title">正在读取任务…</h1>
          <p class="sr-only" id="actual-summary">正在恢复主会话的最新明确进展。</p>
        </div>
        <dl class="overview-metrics">
          <div>
            <dt>主会话</dt>
            <dd id="task-status">读取中</dd>
          </div>
          <div>
            <dt>正式验收</dt>
            <dd id="formal-summary">尚未关联</dd>
          </div>
          <div>
            <dt>最终门禁</dt>
            <dd id="gate-label">尚未关联</dd>
          </div>
        </dl>
      </section>

      <div class="dashboard-grid">
        <section class="panel activity-panel" aria-labelledby="activity-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">主会话实际进展</p>
              <h2 id="activity-title">最近发生了什么</h2>
            </div>
            <span class="freshness" id="freshness">等待首个快照</span>
          </div>
          <section class="next-inline" aria-labelledby="next-title">
            <p class="eyebrow">唯一下一动作</p>
            <div class="next-heading-row">
              <h3 id="next-title">接下来做什么</h3>
              <span class="divergence-status" id="divergence-panel" hidden>
                <button class="divergence-badge" type="button" aria-describedby="divergence-tooltip">登记滞后</button>
                <span class="divergence-tooltip" id="divergence-tooltip" role="tooltip">
                  <span id="divergence"></span>
                </span>
              </span>
            </div>
            <p id="next-action">关联实施包后显示正式登记的下一动作。</p>
            <div class="blocker" id="blocker" hidden></div>
          </section>
          <ol class="activity-list" id="activity-list" aria-live="polite"></ol>
        </section>

        <section class="panel tickets-panel" aria-labelledby="tickets-title">
          <div class="panel-heading tickets-heading">
            <div>
              <p class="eyebrow">正式事项状态</p>
              <h2 id="tickets-title">Tickets验收路径</h2>
            </div>
            <div class="ticket-legend" aria-label="状态说明">
              <span><i class="legend-dot done"></i>已验收</span>
              <span><i class="legend-dot active"></i>需复核</span>
              <span><i class="legend-dot waiting"></i>待推进</span>
            </div>
          </div>
          <div class="flow-layout" id="flow-layout" hidden>
            <div class="flow-scroll" id="flow-scroll" aria-label="事项依赖关系图">
              <div class="flow-canvas" id="flow-canvas">
                <svg class="dependency-lines" id="dependency-lines" aria-hidden="true"></svg>
                <div class="flow-stages" id="flow-stages"></div>
              </div>
            </div>
          </div>
          <p class="empty-state" id="ticket-empty">选择一个实施包后显示正式验收状态。</p>
          <div class="ticket-tooltip" id="ticket-tooltip" role="tooltip" hidden>
            <div class="tooltip-heading">
              <div>
                <span class="tooltip-code" id="tooltip-code"></span>
                <h3 id="tooltip-name"></h3>
              </div>
              <span class="state-badge" id="tooltip-state"></span>
            </div>
            <p class="tooltip-dependencies" id="tooltip-dependencies"></p>
            <ul class="tooltip-hints" id="tooltip-hints"></ul>
          </div>
        </section>
      </div>

      <details class="audit panel">
        <summary>技术核对信息</summary>
        <dl id="audit-list"></dl>
      </details>
    </main>
  </body>
</html>

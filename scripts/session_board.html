<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 看板</title>
<style>
:root{--ink:#20262d;--ink2:#3d4855;--muted:#65717e;--teal:#178378;--blue:#3975b7;
  --line:rgba(39,55,72,.13);--line2:rgba(39,55,72,.075);--paper:#fff;
  --warn:#91651f;--danger:#b0452e;
  --sh1:0 3px 12px rgba(35,48,65,.055),0 1px 2px rgba(35,48,65,.045);
  --sh2:0 4px 14px rgba(38,55,75,.08),0 1px 2px rgba(38,55,75,.05);
  --sh3:0 20px 70px rgba(38,55,75,.14);
  --r1:5px;--r2:8px;--r3:9px;--r4:12px;--r5:14px;--pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --ease:cubic-bezier(.2,.7,.3,1);--t1:.16s;
  --gutter:34px;
  --f:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;color:var(--ink);font:14px/1.5 var(--f);background:#101419}
  background:radial-gradient(620px 460px at 16% 30%,#cfeee6 0,rgba(207,238,230,0) 62%),radial-gradient(680px 500px at 78% 26%,#d7e6fb 0,rgba(215,230,251,0) 64%),radial-gradient(560px 420px at 46% 88%,#ddf2ec 0,rgba(221,242,236,0) 60%),radial-gradient(900px 460px at 50% -14%,#fff 0,rgba(255,255,255,0) 58%),#f4f7f9;background-attachment:fixed
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #8096ad;outline-offset:3px}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- top bar: the one place glass is allowed to be strong ---- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:13px var(--gutter);flex-wrap:wrap;
  background:rgba(16,20,25,.66);backdrop-filter:blur(22px) saturate(130%);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:650;letter-spacing:-.35px;white-space:nowrap;color:#eef3f7}
.brand .logo{display:grid;grid-template-columns:repeat(3,4px);gap:3px;align-items:start;height:22px}
.brand .logo i{display:block;width:4px;height:18px;border-radius:3px;background:#84a4b3}
.brand .logo i:nth-child(2){height:12px}.brand .logo i:nth-child(3){height:15px}
.brand .z{font-size:13px;font-weight:500;color:#8fa0ad;letter-spacing:0}
.search{position:relative;display:flex;align-items:center;gap:8px;min-width:200px;padding:8px 11px;
  border:1px solid rgba(255,255,255,.12);border-radius:var(--r3);background:rgba(255,255,255,.06)}
.search svg{color:#8fa0ad}
.search input{width:100%;border:0;outline:0;background:transparent;font:inherit;color:#eef3f7}
.search input::placeholder{color:#7f8f9c}
.seg{display:flex;gap:4px;align-items:center}
.seg button{display:inline-flex;align-items:center;padding:8px 12px;border-radius:var(--r2);color:#9fb0bd;font-size:13.5px;line-height:1;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.08);color:#e8eef3}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.12);color:#fff;font-weight:650}
#filters em{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:var(--r1);background:rgba(255,255,255,.14);color:#dbe6ee;font:500 11px/1.5 var(--f);font-style:normal;font-variant-numeric:tabular-nums}
.right{margin-left:auto;display:flex;align-items:center;gap:10px;color:#8fa0ad;font-size:12px;font-variant-numeric:tabular-nums}
.syncdot{width:7px;height:7px;border-radius:50%;background:#12a18b}.syncdot.bad{background:var(--danger)}
.ib{position:relative;display:grid;place-items:center;width:30px;height:30px;border:1px solid transparent;border-radius:var(--r2);color:#a9b8c4}
.ib:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.ib[aria-pressed=true]{background:#293746;border-color:#293746;color:#fff}
.ib:disabled svg{animation:spin 1s linear infinite}
.ib .n{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 4px;border-radius:var(--pill);background:rgba(255,255,255,.16);color:#e6eef4;font-size:10px;line-height:15px;text-align:center;font-variant-numeric:tabular-nums}

/* ---- page head ---- */
.groups{display:flex;gap:6px;padding:30px var(--gutter) 0;flex-wrap:wrap}.groups:empty{display:none}
.gchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid rgba(255,255,255,.12);border-radius:var(--r2);background:rgba(255,255,255,.05);color:#b9c7d2;font-size:12px}
.gchip:hover{background:rgba(255,255,255,.1);color:#eef3f7}
.gchip[aria-pressed=true]{background:#eef3f7;border-color:#eef3f7;color:#16202a;font-weight:650}
.gchip b{font-weight:500;color:#8598a6;font-variant-numeric:tabular-nums}
.banner{margin:12px var(--gutter) 0;padding:7px 12px;border-left:2px solid var(--warn);border-radius:0 6px 6px 0;background:#fbf1de;color:#6b4a14;font-size:12.5px}

/* ---- board: page > lane (glass) > card (solid) ---- */
.page{flex:1;width:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column}
.board{flex:1;display:grid;gap:22px;align-items:start;padding:16px var(--gutter) 40px}
.board.focus{justify-content:center}
.col{--tone:var(--muted);display:flex;flex-direction:column;min-width:0;padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  backdrop-filter:blur(26px) saturate(120%);-webkit-backdrop-filter:blur(26px) saturate(120%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 16px 48px rgba(0,0,0,.38)}
.col[data-tone=run]{--tone:#1c9c90}.col[data-tone=todo]{--tone:#699fe1}
.col[data-tone=done]{--tone:#8fa3b5}.col[data-tone=mute]{--tone:#b3bec8}
.col.over{border-color:#3fae9f;background:rgba(47,176,158,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 2px rgba(47,176,158,.18)}
.colbar{display:flex;align-items:center;gap:8px}
.colhead{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:2px 3px 12px;color:#e9f0f5;font-size:14px;font-weight:650;text-align:left}
.colhead .mark{width:9px;height:9px;border-radius:3px;background:var(--tone);flex:none}
.colhead .lb{letter-spacing:-.1px}
.colbar .c{flex:none;margin-left:auto;color:#8598a6;font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.colhead:hover .lb{color:#fff}
.cards{display:flex;flex-direction:column;gap:12px;padding-bottom:2px}
.win{flex:none;padding:2px 4px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:rgba(255,255,255,.06);color:#c6d3dd;font-size:11px;outline:0;cursor:pointer}
.win option{background:#141b22;color:#eaf1f6}
.empty{margin:0;padding:18px 4px 22px;color:#7f8f9c;font-size:12px}
.more{border:1px dashed rgba(255,255,255,.16);border-radius:var(--r2);background:rgba(255,255,255,.04);padding:7px;color:#8fa0ad;font-size:12px;margin-top:2px}
.more:hover{color:#e9f0f5;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}
.agg{flex:none;white-space:nowrap;margin-left:2px;font-size:11.5px;font-weight:500}
.agg.need{color:#e0a45a}.agg.fresh{color:#5fd0bd}
.muted{color:var(--muted);font-size:12.5px}

/* ---- directory groups ---- */
.group{display:flex;flex-direction:column}
.grp{display:flex;align-items:center;gap:7px;width:100%;padding:9px 3px;color:#a9b8c4;font-size:12px;font-weight:600;text-align:left}
.grp:hover{color:#eef3f7}
.grp .chev{width:12px;height:12px;transition:transform var(--t1) var(--ease);opacity:.75;color:#7f8f9c}
.grp[aria-expanded=false] .chev{transform:rotate(-90deg)}
.grp svg{width:14px;height:14px;opacity:.8}.grp .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glist{display:flex;flex-direction:column;gap:9px}

/* ---- card: the solid surface ---- */
.card{position:relative;padding:14px 18px;border:1px solid rgba(255,255,255,.55);border-radius:var(--r3);
  background:rgba(246,250,253,.72);
  backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);
  box-shadow:0 12px 30px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.6);
  cursor:pointer;transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease),box-shadow var(--t1) var(--ease)}
.card:hover{border-color:rgba(255,255,255,.85);background:rgba(250,253,255,.86);box-shadow:0 16px 36px rgba(0,0,0,.38),inset 0 1px 0 #fff}
.card.sel{border-color:#3fae9f;box-shadow:0 0 0 2px rgba(47,176,158,.35),0 12px 30px rgba(0,0,0,.3)}
.card.dragging{opacity:.4}
.row{display:flex;align-items:center;gap:9px}
.st{flex:none;width:15px;height:15px;display:block;border-radius:50%;color:#15968b}
.st.exec{border:1.8px solid currentColor;border-right-color:transparent;animation:spin 2s linear infinite}
.st.active{border:1.8px solid currentColor;border-right-color:transparent}
.st.done{border:1.6px solid #4785c1;border-radius:4px;display:grid;place-items:center;font-size:11px;line-height:1;color:#4785c1}
.st.done::after{content:'✓'}
.st.idle{border:1.5px solid #93a7b3}
.st.unk{border:1.5px dashed #b3bfc8}
@keyframes spin{to{transform:rotate(360deg)}}
.title{flex:1;min-width:0;margin:0;font-size:15px;font-weight:650;letter-spacing:-.2px;line-height:1.35;color:#18222b;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title .dupe{margin-left:6px;color:#6b7783;font-weight:400;font-size:11px;letter-spacing:0}
.t{flex:none;font-size:11px;color:#5f6b78;white-space:nowrap;font-variant-numeric:tabular-nums}
.new{flex:none;width:6px;height:6px;border-radius:50%;background:#079c90}
.pv{margin:7px 0 0;font-size:13px;line-height:1.55;color:#3f4b57;max-height:calc(1.55em * 2 + .6px);overflow:hidden;overflow-wrap:anywhere}
.pv.open{max-height:none}
.pv .mk{display:inline-flex;vertical-align:-1px;margin-right:4px;color:#7e8a96}.pv .mk svg{width:10px;height:10px}
.pv.stale{opacity:.62}
.att{display:flex;align-items:center;gap:7px;margin:6px 0 0;color:#8a5a17;font-size:12px;font-weight:550;line-height:1.45}
.att svg{width:14px;height:14px;flex:none;margin-top:0}
.att span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:7px;margin:7px 0 0;padding-right:52px;color:#66727f;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:190px;padding:2px 7px;border-radius:var(--r1);background:#e8eef4;color:#4d5b67;font-size:11px;white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.agent{background:transparent;color:#71808c;box-shadow:inset 0 0 0 1px #dbe3ea}
.ex{margin-right:auto;color:#23746c;font-size:12px;padding:0;background:none}
.ex:hover{text-decoration:underline}
.go{position:absolute;right:10px;bottom:9px;display:none;align-items:center;gap:4px;padding:2px 8px;border:1px solid #cfd9e2;border-radius:6px;background:rgba(255,255,255,.94);color:#3d4b57;font-size:11px;text-decoration:none;box-shadow:0 2px 8px rgba(20,40,60,.14)}
.go svg{width:11px;height:11px}
.card:hover .go,.card:focus-within .go{display:inline-flex}

/* ---- collapsed lanes: a light column of expand buttons, no container ---- */
.archive{display:grid;gap:10px;align-content:start;min-width:0}
.archive button{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:15px 12px;border:1px solid rgba(255,255,255,.1);border-radius:var(--r4);
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));backdrop-filter:blur(18px);
  color:#a9b8c4;font-size:12px;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.3)}
.archive button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.archive button.over{border-color:#7fc4bb;background:#eef8f6}
.archive b{font-weight:550;color:#dbe6ee}
.archive .n{color:#8598a6;font-size:11.5px;font-variant-numeric:tabular-nums}
.archive .dot{width:6px;height:6px;margin-left:4px;border-radius:50%;background:#c08a24;flex:none}
.archive .n{margin-left:auto}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:70;max-width:400px;padding:9px 12px;border-radius:var(--r2);background:#3a4756;color:#f2f5f8;border:1px solid rgba(255,255,255,.16);font-size:12.5px;line-height:1.65;box-shadow:0 14px 40px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}

/* ---- assistant panel ---- */
#panel{position:fixed;z-index:40;right:20px;bottom:20px;width:min(420px,calc(100vw - 40px));max-height:min(540px,72vh);display:none;flex-direction:column;
  background:#141b22;border:1px solid rgba(255,255,255,.08);border-radius:var(--r5);box-shadow:0 24px 60px rgba(0,0,0,.55)}
#panel.on{display:flex}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:650;font-size:12.5px;letter-spacing:.02em;color:#e9f0f5}
.ph .ib{margin-left:auto}
#plog{flex:1;min-height:80px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px;font-size:13px;line-height:1.6}
.bub{padding:8px 11px;border-radius:var(--r2);white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;max-width:88%;background:rgba(47,176,158,.18);color:#d7f2ec}
.bub.ai{align-self:stretch;background:rgba(255,255,255,.06);color:#c6d3dd}
.bub.sys{align-self:flex-start;color:#7f8f9c;font-size:12px;background:transparent;padding:2px 0}
#pform{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.08)}
#pform input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid rgba(255,255,255,.12);border-radius:var(--r2);background:rgba(255,255,255,.05);color:#eaf1f6;outline:0}
#pform input:focus{border-color:#3fae9f;background:rgba(255,255,255,.08)}
#pform button{height:32px;padding:0 14px;border-radius:var(--r2);background:#e9f0f5;color:#16202a;font-size:13px;font-weight:600}
#pform button:disabled{opacity:.5}

/* ---- drawer ---- */
#scrim{position:fixed;inset:0;z-index:45;display:none;background:rgba(3,6,9,.58)}#scrim.on{display:block}
#drawer{position:fixed;z-index:50;top:14px;right:14px;bottom:14px;width:min(440px,calc(100vw - 28px));overflow:auto;padding:22px 26px 30px;
  background:#141b22;border:1px solid rgba(255,255,255,.08);border-radius:var(--r5);box-shadow:-26px 0 70px rgba(0,0,0,.55);
  transform:translateX(103%);visibility:hidden;transition:transform .22s var(--ease),visibility 0s .22s}
#drawer.open{transform:none;visibility:visible;transition:transform .22s var(--ease)}
.dh{display:flex;align-items:center;gap:7px;color:#8fa0ad;font-size:12px}.dh .st{width:13px;height:13px}.dh .ib{margin:0 0 0 auto;color:#a9b8c4}
#drawer h2{margin:14px 0 10px;font:650 21px/1.35 var(--f);letter-spacing:-.4px;overflow-wrap:anywhere;color:#eef3f7}
.subrow{display:flex;align-items:center;gap:var(--s3);color:#aebdc9}.path{flex:1;min-width:0;color:#7f8f9c;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--r3);background:#e9f0f5;color:#16202a;text-decoration:none;font-size:12.5px;font-weight:600;white-space:nowrap}
.open-btn.off{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#7f8f9c;pointer-events:none}
.lab{display:flex;align-items:center;gap:6px;margin:24px 0 8px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:600;letter-spacing:.1em;color:#7f8f9c}
.states{display:flex;gap:4px;margin-top:14px;padding:3px;border-radius:var(--r3);background:rgba(255,255,255,.05)}
.states button{flex:1;padding:7px 0;border-radius:6px;font-size:12.5px;color:#9fb0bd}
.states button:hover{color:#eaf1f6}
.states button[aria-pressed=true]{background:rgba(255,255,255,.12);color:#fff;font-weight:650}
.fields{display:flex;gap:6px;margin-top:12px}
.fields input{flex:1;min-width:0;padding:8px 10px;border:1px solid rgba(255,255,255,.12);border-radius:var(--r2);background:rgba(255,255,255,.05);color:#eaf1f6;font-size:12.5px;outline:0}
.fields input:focus{border-color:#3fae9f;background:rgba(255,255,255,.08)}
.fields .nb{display:inline-flex;align-items:center;gap:4px;padding:8px 10px;border:1px solid rgba(255,255,255,.12);border-radius:var(--r2);color:#9fb0bd;font-size:12px;background:rgba(255,255,255,.04)}
.fields .nb[aria-pressed=true]{border-color:#3fae9f;color:#7fded0;background:rgba(47,176,158,.14)}
#drawer textarea{width:100%;min-height:70px;margin-top:10px;padding:9px 11px;border:1px solid rgba(255,255,255,.12);border-radius:var(--r2);background:rgba(255,255,255,.05);color:#eaf1f6;resize:vertical;outline:0}
#drawer textarea:focus{border-color:#3fae9f;background:rgba(255,255,255,.08)}
.saved{margin-left:auto;color:#5fd0bd;font-size:11.5px}
.sum{padding:0 0 0 12px;border-left:2px solid #2f9e8f;line-height:1.7;color:#c6d3dd}
.sum .att{margin:8px 0 0 0}
.sum small{display:block;margin-top:6px;color:#7f8f9c;font-size:11px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{position:relative;padding:9px 12px;border-radius:var(--r2);font-size:13px;line-height:1.65;overflow-wrap:anywhere;color:#c6d3dd}
.msg.user{--bubble:rgba(47,176,158,.16);align-self:flex-end;max-width:86%;background:var(--bubble);color:#d7f2ec}
.msg.agent{--bubble:rgba(255,255,255,.055);align-self:stretch;background:var(--bubble);border:1px solid rgba(255,255,255,.07);color:#c6d3dd}
.msg .body{max-height:15em;overflow:hidden}.msg.open .body{max-height:none}
.msg.clip .body::after{content:'';position:absolute;left:0;right:0;bottom:30px;height:3em;background:linear-gradient(transparent,var(--bubble))}
.msg .tg{display:block;margin:8px 0 0;padding:0;color:#5fd0bd;font-size:12px}
.msg .cut{margin-top:4px;color:#7f8f9c;font-size:11px}
.md>*:last-child{margin-bottom:0}.md p{margin:0 0 .55em}.md .h{margin:.4em 0 .3em;font-weight:650}
.md ul,.md ol{margin:.15em 0 .55em;padding-left:1.3em}.md li{margin:.2em 0}.md li.sub{margin-left:1em}
.md code{padding:0 4px;border-radius:4px;background:rgba(255,255,255,.1);color:#dbe6ee;font:12px Consolas,"Cascadia Mono",monospace}
.md pre{margin:.3em 0 .6em;padding:8px 10px;overflow:auto;border-radius:var(--r2);background:#0d1318;border:1px solid rgba(255,255,255,.07);color:#e8eef3;font:12px/1.5 Consolas,"Cascadia Mono",monospace}.md pre code{padding:0;background:none}
.rm{margin-top:30px;color:#e0776a;display:inline-flex;align-items:center;gap:6px;padding:4px 0;font-size:12.5px}
.rm:hover{text-decoration:underline}
.note{margin-top:12px;color:#7f8f9c;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;padding:9px 16px;border-radius:var(--r2);background:#3a4756;color:#f2f5f8;font-size:13px;border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.hidden{display:none!important}
.usage{position:fixed;left:16px;bottom:14px;z-index:6;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:var(--pill);font-size:11px;color:#93a3b0;background:rgba(18,25,32,.78);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);font-variant-numeric:tabular-nums}
.urange{padding:3px 8px;border-radius:var(--pill);color:#b6c5d1;font-size:11px;white-space:nowrap}
.urange:hover{background:rgba(255,255,255,.08);color:#eaf1f6}
.utotal{color:#eaf1f6;font-weight:600}

</style></head><body>

  <div class="seg" id="filters" role="group" aria-label="筛选"><button data-f="all" aria-pressed="true">全部</button><button data-f="focus" aria-pressed="false" title="只看进行中的会话">专注</button><button data-f="todo" aria-pressed="false" title="AI 判定需要你拍板，或出现阻塞">待我处理<em id="todo-n"></em></button></div>

</header>

</main>

  <form id="pform"><input id="pinput" placeholder="告诉助手要整理什么…" autocomplete="off" aria-label="给助手的指令"><button type="submit">发送</button></form>

  <div class="utip" id="utip"></div>
  <div class="umen" id="umenu" role="menu"></div>
</div>
<script>
const token='__BOARD_TOKEN__';
const P={search:'<circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" />',refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" />',trash:'<path d="M3 6h18" /> <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /> <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /> <line x1="10" x2="10" y1="11" y2="17" /> <line x1="14" x2="14" y1="11" y2="17" />',folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />',ext:'<path d="M15 3h6v6" /> <path d="M10 14 21 3" /> <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />',close:'<path d="M18 6 6 18" /> <path d="m6 6 12 12" />',alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" />',bot:'<path d="M12 8V4H8" /> <rect width="16" height="12" x="4" y="8" rx="2" /> <path d="M2 14h2" /> <path d="M20 14h2" /> <path d="M15 13v2" /> <path d="M9 13v2" />',chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />',exec:'<path d="M20 12a8 8 0 1 1-4.7-7.3"/>',active:'<rect x="5.5" y="5.5" width="13" height="13" rx="3.5"/>',idle:'<path d="M7 12h10"/>',done:'<rect x="5.5" y="5.5" width="13" height="13" rx="3.5" fill="currentColor" stroke="none"/>',unk:'<rect x="5.5" y="5.5" width="13" height="13" rx="3.5" stroke-dasharray="2.5 3"/>',note:'<path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" /> <path d="M2 6h4" /> <path d="M2 10h4" /> <path d="M2 14h4" /> <path d="M2 18h4" /> <path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" />',chev:'<path d="m6 9 6 6 6-6" />',spark:'<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" /> <path d="M20 3v4" /> <path d="M22 5h-4" /> <path d="M4 17v2" /> <path d="M5 18H3" />'};
const icon=n=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','i');s.setAttribute('viewBox','0 0 24 24');s.innerHTML=P[n];return s};
const STATES=[['进行中','run'],['待查看','todo','最近'],['已完成','done'],['暂不关注','mute','搁置']];
let recentDays=1; // how far the 最近 lane reaches; the server keeps the choice
// Untriaged ('自动') items are placed by facts: running -> in progress, active within a day -> to review, else shelved.
const ACTIVE=30*60; // recent activity keeps a session in 进行中, but it is not proof the agent is working
const act=i=>i.activity||i.source_time;  // last real message, not the file mtime the host keeps rewriting
const ageOf=i=>Date.now()/1000-act(i);
const colOf=i=>i.state!=='自动'?i.state:(i.runtime==='运行中'||ageOf(i)<=ACTIVE)?'进行中':ageOf(i)<recentDays*86400?'待查看':'暂不关注';
const EXEC={exec:'执行中',done:'本轮结束',idle:'空闲',unk:'状态未知',active:'近期活跃'};
// only claim what the host can prove: busy, finished its turn (idle with an unread result), idle, or unknown
const execOf=i=>i.runtime==='运行中'?'exec':i.runtime==='空闲'?(i.unread?'done':'idle'):ageOf(i)<=ACTIVE?'active':'unk';
const colCollapsed=n=>n in colFold?colFold[n]:['已完成','暂不关注'].includes(n);
const colFold=JSON.parse(localStorage.getItem('board.colfold')||'{}');
const $=s=>document.querySelector(s);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
document.querySelectorAll('[data-i]').forEach(s=>s.replaceChildren(icon(s.dataset.i)));
let items=[],busy=false,dragging=false,openId=null,filter='all',groupFilter='',showRemoved=false,showAgents=false;const cap={};
const fold=JSON.parse(localStorage.getItem('board.fold')||'{}'); // lane|dir -> collapsed; the shelved lane starts collapsed
const rootOf=i=>(i.cwd||'').replace(/[\\/]\.(claude[\\/])?worktrees[\\/].*$/i,'');
const dirName=r=>r.split(/[\\/]/).filter(Boolean).pop()||'未知目录';

const ago=v=>{const s=Date.now()/1000-(typeof v==='number'?v:Date.parse(v)/1000);if(!(s>=0))return '';if(s<90)return '刚刚';if(s<3600)return Math.round(s/60)+' 分钟前';if(s<86400)return Math.round(s/3600)+' 小时前';return Math.round(s/86400)+' 天前'};
const clean=t=>String(t||'').replace(/[`*#>_]/g,'').replace(/\s+/g,' ').trim().slice(0,240);
const tint=name=>{const h=[...name].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);return `--dot:hsl(${h} 42% 44%)`};
// a pending decision stays pending until handled, even if newer messages arrived
const attention=i=>i.summary&&i.summary.attention||'';
const preview=i=>{const s=i.summary;if(s&&s.summary)return{text:s.summary,ai:true,stale:s.stale};const e=i.events.find(x=>x.kind==='assistant')||i.events[0];return{text:e?clean(e.text):'',ai:false}};
const expanded=new Set();const noteOpen=new Set();const previewOpen=new Set();
const pending=i=>Boolean(attention(i));   // '待处理' = the assistant flagged a decision/blocker
function md(text){const root=el('div','md');let para=[],list=null,code=null;
  const inline=(to,t)=>{const re=/(\*\*[^*]+\*\*|`[^`]+`)/g;let last=0,m;while((m=re.exec(t))){if(m.index>last)to.append(t.slice(last,m.index));to.append(m[0][0]==='`'?el('code','',m[0].slice(1,-1)):el('strong','',m[0].slice(2,-2)));last=m.index+m[0].length}if(last<t.length)to.append(t.slice(last))};
  const flush=()=>{if(para.length){const p=el('p');para.forEach((l,k)=>{if(k)p.append(document.createElement('br'));inline(p,l)});root.append(p);para=[]}};
  for(const raw of text.replace(/\r/g,'').split('\n')){
    if(code){if(/^\s*```/.test(raw)){const pre=el('pre');pre.append(el('code','',code.join('\n')));root.append(pre);code=null}else code.push(raw);continue}
    if(/^\s*```/.test(raw)){flush();list=null;code=[];continue}
    if(!raw.trim()){flush();list=null;continue}
    const h=raw.match(/^#{1,6}\s+(.*)$/);if(h){flush();list=null;const d=el('div','h');inline(d,h[1]);root.append(d);continue}
    if(/^\s*([-*_])\1{2,}\s*$/.test(raw)){flush();list=null;continue}
    const li=raw.match(/^(\s*)([-*•]|\d+[.)])\s+(.*)$/);
    if(li){flush();const ord=/\d/.test(li[2]);if(!list||list.ord!==ord){list={ord,node:el(ord?'ol':'ul')};root.append(list.node)}const n=el('li',li[1].length>=2?'sub':'');inline(n,li[3]);list.node.append(n);continue}
    list=null;para.push(raw.trim())}
  flush();if(code){const pre=el('pre');pre.append(el('code','',code.join('\n')));root.append(pre)}return root}
const hay=i=>[i.title,i.cwd,i.group_name,i.note,i.summary&&i.summary.summary].join(' ').toLowerCase();

async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Board-Token':token},body:JSON.stringify(data)}:{headers:{'X-Board-Token':token}});if(r.status===403&&!sessionStorage.getItem('reloaded')){sessionStorage.setItem('reloaded','1');location.reload();throw Error('服务已重启，正在重新加载')}sessionStorage.removeItem('reloaded');const v=await r.json();if(!r.ok||v.ok===false)throw Error(v.error||'请求失败');return v}
const RANGES=[['1h','近 1 小时'],['today','今天'],['7d','近 7 天']];
let usageRange=localStorage.getItem('board.usageRange')||'today',usageData={};
const unit=n=>{const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'')+'B';
  if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(a>=1e3)return (n/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'K';
  return String(n)};
function showUsage(usage){usageData=usage||{};paintUsage()}
function paintUsage(){const box=$('#usage');if(!box)return;
  const rows=usageData[usageRange]||{},sum=rows.summary||[0,0],chat=rows.chat||[0,0];
  const s=sum[0]+sum[1],c=chat[0]+chat[1],name=(RANGES.find(r=>r[0]===usageRange)||RANGES[1])[1];
  $('#urange').textContent=name+' ▾';$('#urange').setAttribute('aria-expanded',String(box.classList.contains('menu')));
  $('#utotal').textContent=unit(s+c);
  const tip=$('#utip');tip.replaceChildren();
  [['自动整理',s],['我的指令',c]].forEach(([label,n])=>{const line=el('div');line.append(label+' ');line.append(el('b','',unit(n)));tip.append(line)});
  box.hidden=false}
let toastTimer;function report(m){const t=$('#toast');t.textContent=m;t.classList.toggle('hidden',!m);clearTimeout(toastTimer);if(m)toastTimer=setTimeout(()=>t.classList.add('hidden'),5000)}
async function refresh(sync=true){if(busy)return;busy=true;$('#refresh').disabled=true;try{if(sync){const s=await api('/api/sync',{});$('#sync').textContent=new Date(s.time*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' 同步'+(s.errors?' · '+s.errors+' 项失败':'');$('#syncdot').classList.remove('bad')}const res=await api('/api/items');items=res.items;if(res.recent_days)recentDays=res.recent_days;showUsage(res.usage);render()}catch(e){$('#sync').textContent='同步失败';$('#syncdot').classList.add('bad');report('更新失败：'+e.message)}finally{busy=false;$('#refresh').disabled=false}}
async function update(id,data){const item=items.find(i=>i.id===id),before=item&&{...item};if(item){Object.assign(item,data.mark_read?{unread:false}:data);render()}
  try{await api('/api/items/'+encodeURIComponent(id),data);refresh(false);return true}catch(e){if(item){Object.assign(item,before);render()}report('保存失败：'+e.message);return false}}

function card(i,dupes){
  const c=el('article','card'+(i.runtime==='运行中'?' run':'')+(attention(i)?' warn':'')+(i.id===openId?' sel':''));c.tabIndex=0;c.draggable=true;c.dataset.id=i.id;
  const r=el('div','row');const ek=execOf(i),d=el('span','st '+ek);d.title=EXEC[ek]+(ek==='active'?'（最近 30 分钟有活动）':'');
  const h3=el('h3','title',clean(i.title).slice(0,120));if(dupes&&dupes>1){const tag=el('span','dupe','·'+i.id.slice(0,4));tag.title='同名会话，用 ID 前缀区分';h3.append(tag)}
  r.append(d,h3,el('time','t',ago(act(i))));if(i.unread){const n=el('span','new');n.title='有新内容';r.append(n)}c.append(r);
  const p=preview(i);if(p.text){const pv=el('p','pv'+(p.ai?' ai':'')+(p.stale?' stale':''));if(p.ai){const mk=el('span','mk');mk.append(icon('spark'));pv.append(mk)}pv.append(p.text);if(previewOpen.has(i.id))pv.classList.add('open');
    pv.addEventListener('mouseenter',()=>{if(pv.dataset.clip)showTip(pv,p.text)});
    pv.addEventListener('mouseleave',hideTip);c.append(pv)}
  const a=attention(i);if(a){const w=el('div','att');w.append(icon('chat'),el('span','',a));c.append(w)}
  const m=el('div','meta');
  if(i.agent){const g=el('span','chip agent');g.append(el('span','','后台'));m.append(g)}
  if(i.group_name){const g=el('span','chip',undefined);g.style.cssText=tint(i.group_name);g.append(el('span','',i.group_name));m.append(g)}
  if(i.link){const g=el('a','go');g.href=i.link;g.append('打开',icon('ext'));g.addEventListener('click',e=>{e.stopPropagation();update(i.id,{mark_read:true,read_generation:i.generation,read_cursor:i.cursor})});c.append(g)}
  if(m.childElementCount)c.append(m);
  c.addEventListener('click',()=>openDrawer(i.id));c.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target===c)openDrawer(i.id)});
  c.addEventListener('dragstart',e=>{dragging=true;c.classList.add('dragging');e.dataTransfer.setData('text/plain',i.id);e.dataTransfer.effectAllowed='move'});
  c.addEventListener('dragend',()=>{dragging=false;c.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
  return c}

function groupRows(rows){const m=new Map();for(const i of rows){const r=rootOf(i);if(!m.has(r))m.set(r,{root:r,name:dirName(r),rows:[]});m.get(r).rows.push(i)}
  const live=g=>g.rows.some(i=>i.runtime==='运行中'),last=g=>Math.max(...g.rows.map(act));
  return [...m.values()].sort((a,b)=>live(b)-live(a)||last(b)-last(a))}
function groupEl(lane,g,nameCount){const k=lane+'|'+g.root,closed=k in fold?fold[k]:['暂不关注','已完成'].includes(lane);
  const w=el('div','group'),h=el('button','grp');h.type='button';h.setAttribute('aria-expanded',String(!closed));h.title='工作区：'+g.root;
  const chev=icon('chev');chev.classList.add('chev');h.append(chev,icon('folder'),el('span','nm',g.name));
  const need=g.rows.filter(pending).length,fresh=g.rows.filter(i=>i.unread).length;
  if(need)h.append(el('span','agg need',need+' 待处理'));if(fresh)h.append(el('span','agg fresh',fresh+' 新结果'));
  if(need)h.title+=' · '+need+' 个需要你拍板';
  h.onclick=()=>{fold[k]=!closed;localStorage.setItem('board.fold',JSON.stringify(fold));render()};w.append(h);
  if(!closed){const l=el('div','glist'),n=cap[k]||8;g.rows.slice(0,n).forEach(i=>l.append(card(i,nameCount[clean(i.title)])));
    if(g.rows.length>n){const b=el('button','more','还有 '+(g.rows.length-n)+' 个');b.onclick=()=>{cap[k]=n+8;render()};l.append(b)}w.append(l)}
  return w}
function showTip(anchor,text){const tip=$('#tip');tip.textContent=text;tip.classList.add('on');
  const r=anchor.getBoundingClientRect(),w=Math.min(400,innerWidth-24);
  tip.style.width=w+'px';tip.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';
  const h=tip.offsetHeight;tip.style.top=(r.bottom+8+h>innerHeight-8?Math.max(8,r.top-h-8):r.bottom+8)+'px'}
function hideTip(){$('#tip').classList.remove('on')}
function visible(){const q=$('#search').value.toLowerCase().trim();
  // Untitled sessions are almost always background helpers (e.g. prompt suggestions); keep them off the board.
  return items.filter(i=>(i.events.length>0||(i.summary&&i.summary.summary))&&(showAgents||!i.agent)&&Boolean(i.hidden)===showRemoved&&(!groupFilter||i.group_name===groupFilter)&&(!q||hay(i).includes(q))&&
    (filter!=='todo'||pending(i)))}

function render(){if(dragging)return;
  const vis=visible(),board=$('#board'),top=board.scrollLeft,collapsed=[];board.replaceChildren();
  const lanes=filter==='focus'?STATES.filter(([n])=>n==='进行中'):STATES;
  for(const [name,tone,label] of lanes){
    const rows=vis.filter(i=>colOf(i)===name).sort((a,b)=>(b.runtime==='运行中')-(a.runtime==='运行中')||act(b)-act(a));
    if(colCollapsed(name)&&filter!=='focus'){collapsed.push({name,label:label||name,count:rows.length,need:rows.some(pending)});continue}
    const col=el('section','col');col.dataset.tone=tone;
    const h=el('button','colhead');h.type='button';h.title='收起'+(label||name);h.setAttribute('aria-label',h.title);
    h.append(el('span','mark'),el('span','lb',label||name));
    h.onclick=()=>{colFold[name]=true;localStorage.setItem('board.colfold',JSON.stringify(colFold));render()};
    const bar=el('div','colbar');bar.append(h);
    if(name==='待查看'){
      const sel=el('select','win');sel.title='最近的范围';
      [[1,'近 1 天'],[3,'近 3 天'],[7,'近 1 周']].forEach(([d,t])=>{const o=el('option','',t);o.value=String(d);o.selected=d===recentDays;sel.append(o)});
      sel.onchange=async()=>{recentDays=Number(sel.value);render();
        try{await api('/api/settings',{recent_days:recentDays})}catch(e){report('时间范围保存失败：'+e.message)}};
      bar.append(sel)}
    bar.append(el('span','c',String(rows.length)));
    col.append(bar);
    const body=el('div','cards');
    if(!rows.length)body.append(el('div','empty',showRemoved?'':(filter==='focus'?'当前没有进行中的会话':'拖到这里')));

  const gs=$('#groups'),counts=new Map();items.filter(i=>Boolean(i.hidden)===showRemoved&&i.group_name).forEach(i=>counts.set(i.group_name,(counts.get(i.group_name)||0)+1));

  const tn=items.filter(i=>!i.hidden&&!i.agent&&pending(i)).length;const te=$('#todo-n');te.textContent=tn?String(tn):'';te.classList.toggle('hidden',!tn);

function openDrawer(id){openId=id;const seen=items.find(x=>x.id===id);if(seen&&seen.unread)update(id,{mark_read:true,read_generation:seen.generation,read_cursor:seen.cursor});renderDrawer(true);document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.id===id))}
function closeDrawer(){openId=null;$('#drawer').classList.remove('open');$('#scrim').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'))}
function renderDrawer(){const i=items.find(x=>x.id===openId);if(!i)return;const d=$('#drawer');d.replaceChildren();
  const head=el('div','dh'),dot=el('span','st '+execOf(i));

  const x=el('button','ib');x.title='关闭';x.setAttribute('aria-label','关闭');x.append(icon('close'));x.onclick=closeDrawer;head.append(x);
  d.append(head,el('h2','',clean(i.title).slice(0,160)));
  if(i.forks>0)d.append(el('div','path','含 '+(i.forks+1)+' 段历史 · 经过 '+i.forks+' 次 rewind/分叉，已合并为一个会话'));
  // path and the one primary action share a row, so the title keeps the visual weight
  const sub=el('div','subrow');if(i.cwd)sub.append(el('div','path',i.cwd));
  const open=el(i.link?'a':'button','open-btn'+(i.link?'':' off'));open.setAttribute('aria-label',i.link?'在 Desktop 中打开':'Desktop 链接不可用');
  if(i.link){open.href=i.link;open.append(icon('ext'),'在 Desktop 中打开');open.onclick=()=>update(i.id,{mark_read:true,read_generation:i.generation,read_cursor:i.cursor})}else{open.type='button';open.append('链接不可用')}
  if(!i.cwd)open.style.marginLeft='auto';sub.append(open);d.append(sub);
  const st=el('div','states');st.setAttribute('role','group');st.setAttribute('aria-label','我的状态');
  for(const [name,,label] of STATES){const b=el('button');b.type='button';b.title=label||name;b.setAttribute('aria-pressed',String(colOf(i)===name));b.append(label||name);b.onclick=()=>update(i.id,{state:name});st.append(b)}
  d.append(st);
  const g=el('input');g.placeholder='分组';g.setAttribute('aria-label','分组');g.value=i.group_name;g.setAttribute('list','glist');
  const dl=el('datalist');dl.id='glist';[...new Set(items.map(v=>v.group_name).filter(Boolean))].forEach(v=>{const o=el('option');o.value=v;dl.append(o)});
  const n=el('textarea');n.placeholder='备注';n.setAttribute('aria-label','备注');n.value=i.note;
  const save=async()=>{const data={};if(g.value!==i.group_name)data.group_name=g.value;if(n.value!==i.note)data.note=n.value;if(!Object.keys(data).length)return;if(await update(i.id,data)){saved.textContent='已保存';setTimeout(()=>saved.textContent='',1500)}};
  g.addEventListener('change',save);n.addEventListener('blur',save);
  const fields=el('div','fields'),
        nb=el('button','nb');nb.type='button';
  const noteVisible=()=>noteOpen.has(i.id)||!!i.note;
  const paint=()=>{nb.textContent='';nb.append(icon('note'),'备注');nb.setAttribute('aria-pressed',String(noteVisible()));n.classList.toggle('hidden',!noteVisible())};
  nb.onclick=()=>{noteOpen.has(i.id)?noteOpen.delete(i.id):noteOpen.add(i.id);paint()};
  fields.append(g,nb);paint();d.append(fields,dl,n);
  const s=i.summary;
  if(s&&s.summary){const lab=el('div','lab');lab.append(icon('spark'),'摘要');const box=el('div','sum',s.summary);
    const a=attention(i);if(a){const w=el('div','att');w.append(icon('alert'),el('span','',a));box.append(w)}
    box.append(el('small','','AI 生成 · '+ago(s.created_at)+(s.stale?' · 之后又有新消息':'')));d.append(lab,box)}
  const evs=i.events.slice(0,6).reverse();
  if(evs.length){d.append(el('div','lab','最近消息'));const m=el('div','msgs');
    for(const e of evs){const key=e.generation+':'+e.position,b=el('div','msg '+(e.kind==='user'?'user':'agent')+(expanded.has(key)?' open':''));b.dataset.key=key;
      const body=el('div','body');body.append(md(e.text));if(e.text.length>=2000)body.append(el('div','cut','…（只缓存了前 2000 字）'));b.append(body);m.append(b)}
    d.append(m)}
  if(i.limited||i.error)d.append(el('div','note',i.error||'历史记录仅采集了最近一段'));
  const rm=el('button','rm');rm.append(icon('trash'),i.hidden?'恢复到看板':'从看板移除');rm.onclick=async()=>{if(await update(i.id,{hidden:!i.hidden}))closeDrawer()};d.append(rm);
  d.classList.add('open');d.setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  requestAnimationFrame(()=>d.querySelectorAll('.msg').forEach(b=>{const body=b.firstChild,isOpen=b.classList.contains('open');
    if(!isOpen&&body.scrollHeight<=body.clientHeight+2)return;if(!isOpen)b.classList.add('clip');
    const t=el('button','tg',isOpen?'收起':'展开全文');t.type='button';
    t.onclick=()=>{const o=b.classList.toggle('open');b.classList.toggle('clip',!o);t.textContent=o?'收起':'展开全文';o?expanded.add(b.dataset.key):expanded.delete(b.dataset.key)};b.append(t)}))}

$('#scrim').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#refresh').onclick=()=>refresh();window.addEventListener('scroll',hideTip,true);$('#search').addEventListener('input',render);
$('#agents').onclick=()=>{showAgents=!showAgents;render()};
const ask=()=>{$('#panel').classList.toggle('on');$('#ask').setAttribute('aria-pressed',String($('#panel').classList.contains('on')));if($('#panel').classList.contains('on'))$('#pinput').focus()};
$('#ask').onclick=ask;$('#pclose').onclick=ask;
function bubble(text,cls){const b=el('div','bub '+cls,text);$('#plog').append(b);$('#plog').scrollTop=1e9;return b}
$('#pform').onsubmit=async e=>{e.preventDefault();const input=$('#pinput'),text=input.value.trim();if(!text)return;
  input.value='';bubble(text,'me');const btn=$('#pform button');btn.disabled=true;

(function(){const box=$('#usage'),menu=$('#umenu');
  RANGES.forEach(([k,label])=>{const b=el('button');b.type='button';b.dataset.k=k;b.setAttribute('role','menuitemradio');b.textContent=label;
    b.onclick=()=>{usageRange=k;localStorage.setItem('board.usageRange',k);menu.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x.dataset.k===k)));box.classList.remove('menu');paintUsage()};menu.append(b)});
  $('#urange').onclick=e=>{e.stopPropagation();menu.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x.dataset.k===usageRange)));box.classList.toggle('menu')};
  document.addEventListener('click',e=>{if(!box.contains(e.target))box.classList.remove('menu')});})();
let resizeTimer=0;
addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!dragging)render()},120)});
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});

/* Background: a jittered lattice of dots that leans away from the cursor.
   A fixed canvas, so the frosted lanes have something to show through. */
(function () {
  const cv = document.getElementById('bg'), cx = cv.getContext('2d');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = {spacing: 104, jitter: 40, size: 3, reach: 165, strength: 2.4, damp: .86, link: 165, drift: .5};
  const DOT = '84,110,130', GLOW = '125,211,252';
  let W = 0, H = 0, cols = 0, rows = 0, pts = [], raf = 0, last = 0;
  const m = {x: -9e3, y: -9e3, on: false};

  function build() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / C.spacing) + 1; rows = Math.ceil(H / C.spacing) + 1;
    const ox = (W - (cols - 1) * C.spacing) / 2, oy = (H - (rows - 1) * C.spacing) / 2;
    pts = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const x = ox + i * C.spacing + (Math.random() - .5) * C.jitter * 1.6;
      const y = oy + j * C.spacing + (Math.random() - .5) * C.jitter * 1.6;
      pts.push({hx: x, hy: y, x, y, vx: 0, vy: 0, a: Math.random() * 6.2832, sp: .12 + Math.random() * .3, ph: Math.random() * 6.2832});
    }
  }

  function step(dt) {
    const r2 = C.reach * C.reach, drift = calm ? 0 : C.drift * dt * .06;
    for (const p of pts) {
      if (drift) {
        p.hx += Math.cos(p.a) * p.sp * drift; p.hy += Math.sin(p.a) * p.sp * drift;
        p.ph += dt * .001;
        if (p.hx < -20) p.hx += W + 40; else if (p.hx > W + 20) p.hx -= W + 40;
        if (p.hy < -20) p.hy += H + 40; else if (p.hy > H + 20) p.hy -= H + 40;
      }
      if (m.on) {
        const dx = p.x - m.x, dy = p.y - m.y, d2 = dx * dx + dy * dy;
        if (d2 < r2 && d2 > .01) {
          const d = Math.sqrt(d2), f = (1 - d / C.reach) * C.strength;
          p.vx += dx / d * f; p.vy += dy / d * f;
        }
      }
      p.vx += (p.hx - p.x) * .05; p.vy += (p.hy - p.y) * .05;
      p.vx *= C.damp; p.vy *= C.damp;
      p.x += p.vx; p.y += p.vy;
    }
  }

  function paint() {
    cx.clearRect(0, 0, W, H);
    cx.lineWidth = .8;
    const R2 = C.link * C.link;
    const at = (i, j) => (i < 0 || j < 0 || i >= cols || j >= rows) ? null : pts[j * cols + i];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const p = pts[j * cols + i];
      for (const q of [at(i + 1, j), at(i, j + 1), at(i + 1, j + 1), at(i - 1, j + 1)]) {
        if (!q) continue;
        const dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
        if (d2 > R2) continue;
        cx.strokeStyle = 'rgba(' + DOT + ',' + (.22 * (1 - Math.sqrt(d2) / C.link)).toFixed(3) + ')';
        cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(q.x, q.y); cx.stroke();
      }
    }
    if (m.on) {
      const g = cx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 160);
      g.addColorStop(0, 'rgba(' + GLOW + ',.2)'); g.addColorStop(1, 'rgba(' + GLOW + ',0)');
      cx.fillStyle = g; cx.fillRect(m.x - 160, m.y - 160, 320, 320);
    }
    cx.fillStyle = 'rgba(' + DOT + ',.55)';
    for (const p of pts) {
      const r = C.size * (calm ? 1 : 1 + Math.sin(p.ph) * .35);
      cx.beginPath(); cx.arc(p.x, p.y, r, 0, 6.2832); cx.fill();
    }
  }

  function frame(now) {
    const dt = Math.min(50, now - (last || now)); last = now;
    step(dt); paint();
    raf = requestAnimationFrame(frame);
  }

  addEventListener('pointermove', e => { m.x = e.clientX; m.y = e.clientY; m.on = true; }, {passive: true});
  addEventListener('pointerleave', () => { m.on = false; });
  addEventListener('blur', () => { m.on = false; });
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); if (calm) paint(); }, 150); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
  });
  build(); paint();
  if (!calm) raf = requestAnimationFrame(frame);
})();
</script>

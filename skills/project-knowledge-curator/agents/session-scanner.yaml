interface:
  display_name: "Session Experience Scanner"
  short_description: "Read session/thread content and extract durable knowledge candidates"
  default_prompt: "Read the assigned project sessions for the requested time range. Use the current project baseline only as context, not the session's old state. Identify candidate durable lessons, explicit prior knowledge discussions, and sessions that appear already curated. Do not edit files. Return findings with evidence thread IDs, file paths, uncertainty, and suggested keep/covered/drop classification."

role:
  lane: "session-scanner"
  responsibilities:
    - "Read actual session/thread content, not just handoffs."
    - "Search first for hands-on-knowledge, project-knowledge-manager, entry-map, and handoff-new-session markers."
    - "Extract reusable implementation, debug, verification, and recovery lessons."
    - "Flag prior discussions that are not actually covered in the current baseline."
  output: "Use references/subagent-protocol.md output contract."
